name = "dms-ingress"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV Namespace binding for Dead Man's Switch state
# Create via: wrangler kv namespace create DMS_KV
[[kv_namespaces]]
binding = "DMS_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "your-github-username"
GITHUB_REPO = "dead-mans-switch"
GITHUB_WORKFLOW = "heartbeat.yml"
GITHUB_BRANCH = "main"

# Note: Store sensitive secrets using wrangler secret put:
# - wrangler secret put HEARTBEAT_SECRET
# - wrangler secret put STATUS_TOKEN
# - wrangler secret put GITHUB_PAT
